name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caderno
          POSTGRES_USER: caderno
          POSTGRES_PASSWORD: caderno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caderno -d caderno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_DB: caderno
      POSTGRES_USER: caderno
      POSTGRES_PASSWORD: caderno
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src
      - run: uv run ruff format src --check
      - run: uv run mypy --config-file pyproject.toml src
      - run: uv run python src/manage.py makemigrations --check --dry-run
      - run: uv run pytest src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
